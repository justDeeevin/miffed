[package]
name = "miffed"
version = "0.1.0"
edition = "2024"

[dependencies]
chumsky = "0.13.0"
logos = "0.16.1"
thiserror = "2.0.20"
ariadne = "0.6.0"
clap = { version = "4.6.7", features = ["derive"] }
